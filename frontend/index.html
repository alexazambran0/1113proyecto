<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monitor Comedero</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, sans-serif; background: #f4f6f8; color: #111827; }
      main { max-width: 900px; margin: 28px auto; padding: 0 14px; display: grid; gap: 14px; }
      .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px; }
      h1 { font-size: 28px; }
      .status { display: grid; gap: 8px; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
      .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
      button { border: 0; border-radius: 8px; padding: 10px 14px; font-weight: 700; cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: 0.5; }
      .primary { background: #2563eb; color: #fff; }
      .danger { background: #dc2626; color: #fff; }
      .secondary { background: #e5e7eb; color: #111827; }
      .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
      .normal { background: #dcfce7; color: #166534; }
      .bajo { background: #fef9c3; color: #854d0e; }
      .critico { background: #fee2e2; color: #991b1b; }
      .conectado { background: #dcfce7; color: #166534; }
      .desconectado { background: #fee2e2; color: #991b1b; }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; border-bottom: 1px solid #e5e7eb; padding: 8px 6px; font-size: 14px; }
      th { font-size: 12px; text-transform: uppercase; color: #6b7280; }
      @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Monitor del Comedero</h1>

      <div class="grid">
        <section class="card status">
          <h2>Estado en vivo</h2>
          <p id="conexion">Arduino: ...</p>
          <p id="nivel">Nivel: ...</p>
          <p id="motor">Motor: ...</p>
          <p id="hora">Ultima lectura: ...</p>
          <p id="mensaje">Mensaje: ...</p>
          <p>Estado: <span id="estado-badge" class="badge">...</span></p>
        </section>

        <section class="card">
          <h2>Control del motor</h2>
          <p>Motor DC amarillo, una sola direccion. Encender hace girar; apagar corta el giro.</p>
          <div class="controls">
            <button id="btn-encender" class="primary" type="button">Encender motor</button>
            <button id="btn-apagar" class="danger" type="button">Apagar motor</button>
            <button id="btn-dispensar" class="secondary" type="button">Dispensar 2 segundos</button>
          </div>
          <p id="resultado-comando">Sin comandos enviados.</p>
        </section>
      </div>

      <section class="card">
        <h2>Ultimas lecturas</h2>
        <table>
          <thead>
            <tr>
              <th>Hora</th>
              <th>Nivel</th>
              <th>Motor</th>
            </tr>
          </thead>
          <tbody id="tabla-historial"></tbody>
        </table>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
